codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "50...90"
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: auto
        threshold: 10%

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
