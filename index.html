<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Werewolf - Host Dashboard</title>
<script src="js/config.js"></script>
<script src="js/lang.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;background:#0f0f1a;color:#fff;min-height:100dvh}
.container{max-width:800px;margin:0 auto;padding:16px}

/* Cards */
.card{background:#1a1a2e;border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid #2a2a4a;transition:all .3s}
.card:hover{border-color:#6c63ff44}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;color:#fff;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#6c63ff,#7c6aff)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 15px #6c63ff44}
.btn-danger{background:#ff4757}.btn-danger:hover{transform:translateY(-2px);box-shadow:0 4px 15px #ff475744}
.btn-success{background:#2ed573}.btn-success:hover{transform:translateY(-2px);box-shadow:0 4px 15px #2ed57344}
.btn-outline{background:transparent;border:2px solid #6c63ff;color:#6c63ff}.btn-outline:hover{background:#6c63ff15}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.badge-online{background:#2ed57322;color:#2ed573}
.badge-offline{background:#55555522;color:#888}
.badge-alive{background:#2ed57322;color:#2ed573}
.badge-dead{background:#ff475722;color:#ff4757}
.badge-role{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}

/* Inputs */
.input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #2a2a4a;background:#0f0f1a;color:#fff;font-size:16px;transition:border .3s;outline:none}
.input:focus{border-color:#6c63ff}

/* Layout */
.flex{display:flex}.flex-c{flex-direction:column}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.items-c{align-items:center}.justify-c{justify-content:center}.justify-b{justify-content:space-between}.wrap{flex-wrap:wrap}
.text-c{text-align:center}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}.mb-16{margin-bottom:16px}
.w-full{width:100%}.flex-1{flex:1}.hidden{display:none!important}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#1a1a2e;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.logo-gradient{background:linear-gradient(135deg,#6c63ff,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:#1a1a2e;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid #2a2a4a}
.stat-card .num{font-size:24px;font-weight:700}
.stat-card .label{font-size:11px;color:#8888aa;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* Player cards */
.player-list{display:flex;flex-direction:column;gap:8px}
.player-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#1a1a2e;border:1px solid #2a2a4a;transition:all .3s}
.player-card:hover{border-color:#6c63ff44}
.player-card.dead{opacity:.6}
.online-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.online-dot.online{background:#2ed573;box-shadow:0 0 6px #2ed57366}
.online-dot.offline{background:#555}
.player-name{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tally bars */
.tally-bar{height:8px;border-radius:4px;background:#2a2a4a;overflow:hidden;margin-top:4px}
.tally-fill{height:100%;border-radius:4px;transition:width .3s ease}

/* Phase banner */
.phase-banner{padding:12px 16px;border-radius:12px;text-align:center;font-weight:700;font-size:18px;margin-bottom:16px;letter-spacing:.5px}
.phase-night{background:linear-gradient(135deg,#0d0d2b,#1a1a3e);border:1px solid #6c63ff44;color:#b8b8ff}
.phase-day{background:linear-gradient(135deg,#1a2e1a,#2a3e2a);border:1px solid #2ed57344;color:#7dffa0}
.phase-vote{background:linear-gradient(135deg,#2e1a1a,#3e2a2a);border:1px solid #ff475744;color:#ff7d7d}
.phase-victory{background:linear-gradient(135deg,#2e2e1a,#3e3e2a);border:1px solid #ffa50244;color:#ffd07d}

/* QR */
.qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;background:#fff;border-radius:16px;margin:12px auto;max-width:240px}
.qr-box img,.qr-box canvas{border-radius:8px}
.room-code-display{font-size:32px;font-weight:800;letter-spacing:4px;font-family:monospace;text-align:center;color:#fff}

/* Role chips */
.role-preview{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.role-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px;font-size:12px;font-weight:600}

/* Animations */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Lang toggle */
.lang-toggle{display:flex;gap:4px}
.lang-btn{background:none;border:1px solid #2a2a4a;color:#555;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px;transition:all .3s}
.lang-btn.active{background:#6c63ff22;border-color:#6c63ff;color:#6c63ff}

/* Slider */
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#2a2a4a;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#ff4757;cursor:pointer;border:2px solid #fff}

/* Ad banner */
.ad-banner{text-align:center;padding:12px;margin:12px 0;border:1px dashed #2a2a4a;border-radius:12px;color:#555;font-size:12px;display:none}
.ad-banner.show{display:block}
.ad-banner-sponsored{border-color:#6c63ff44;color:#6c63ff88}

/* Sponsor banner */
.sponsor-banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin:12px 0;border-radius:12px;font-size:13px;display:none}
.sponsor-banner.show{display:flex}
.sponsor-banner.platinum{background:linear-gradient(135deg,#2a2a4a44,#6c63ff22);border:1px solid #6c63ff44;color:#b8b8ff}
.sponsor-banner.gold{background:linear-gradient(135deg,#2a2a1a44,#ffa50222);border:1px solid #ffa50244;color:#ffd07d}

/* Donation section */
.donation-card{text-align:center;padding:16px;border-radius:12px;background:linear-gradient(135deg,#1a1a2e,#2a1a2e);border:1px solid #ff475722;margin:12px 0;display:none}
.donation-card.show{display:block}
.donation-card .heart{font-size:28px;margin-bottom:8px}
.donation-card .donate-btn{padding:10px 24px;border-radius:10px;border:1px solid #ff4757;background:transparent;color:#ff4757;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;margin-top:8px}
.donation-card .donate-btn:hover{background:#ff475722}

/* Premium badge */
.premium-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:linear-gradient(135deg,#ffd70033,#ffa50233);color:#ffd700;border:1px solid #ffa50244;cursor:pointer;transition:all .3s}
.premium-badge:hover{transform:scale(1.05)}

/* Screen toggle */
.screen{display:none}.screen.active{display:block}

/* Mobile */
@media(max-width:480px){
  .container{padding:12px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .room-code-display{font-size:28px}
  .btn{padding:12px 20px;font-size:14px}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">🌙 <span class="logo-gradient">Werewolf</span></div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="langEn" onclick="setLang('en',this)">EN</button>
    <button class="lang-btn" id="langZh" onclick="setLang('zh',this)">中文</button>
  </div>
</div>

<div class="container">

  <!-- ===== LANDING SCREEN ===== -->
  <div id="screen-landing" class="screen active">
    <div class="text-c mt-24 slide-up">
      <div style="font-size:64px;margin-bottom:12px">🌙</div>
      <h1 class="logo-gradient" style="font-size:36px;font-weight:800;margin-bottom:8px" data-i18n="landing-title"></h1>
      <p style="color:#8888aa;font-size:16px;margin-bottom:4px" data-i18n="landing-subtitle"></p>
      <p style="color:#8888aa;font-size:14px;display:none" id="landingSubZh" data-i18n="landing-subtitle-zh"></p>
      <div class="ad-banner show" id="adBannerLanding" data-i18n="advertisement"></div>
      <div class="sponsor-banner platinum show" id="sponsorBanner">
        <span>⭐</span>
        <span style="flex:1">Support Werewolf — Become a sponsor for your classroom or event</span>
        <span class="premium-badge" onclick="alert('Premium features coming soon!')">✨ Premium</span>
      </div>
      <button class="btn btn-primary mt-24" onclick="createRoom()" id="createBtn">
        <span data-i18n="create-game"></span>
      </button>
      <div class="donation-card show" id="donationCard">
        <div class="heart">❤️</div>
        <div style="font-weight:600;margin-bottom:4px">Support Werewolf</div>
        <div style="color:#8888aa;font-size:13px;margin-bottom:4px">Help keep the game free and improve it</div>
        <button class="donate-btn" onclick="alert('Donation link coming soon!')">💛 Donate</button>
      </div>
    </div>
  </div>

  <!-- ===== LOBBY SCREEN ===== -->
  <div id="screen-lobby" class="screen">
    <div class="card slide-up">
      <div class="flex items-c justify-b">
        <div>
          <div style="font-size:12px;color:#8888aa;text-transform:uppercase;letter-spacing:1px" data-i18n="lobby-title"></div>
          <div class="room-code-display" id="roomCodeDisplay">------</div>
        </div>
        <button class="btn btn-sm btn-outline" onclick="copyRoomCode()">📋 <span data-i18n="copy-code"></span></button>
      </div>
      <div class="qr-box" id="qrBox">
        <div id="qrcode"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label" data-i18n="total"></div></div>
      <div class="stat-card"><div class="num" id="statOnline">0</div><div class="label" data-i18n="online"></div></div>
      <div class="stat-card"><div class="num" id="statOffline">0</div><div class="label" data-i18n="offline"></div></div>
    </div>

    <div id="lobbyPlayerList" class="player-list"></div>

    <div class="ad-banner" id="adBannerLobby" data-i18n="advertisement"></div>

    <div class="card">
      <div class="flex items-c gap-12">
        <div class="flex-1">
          <label style="color:#8888aa;font-size:13px"><span data-i18n="wolf-count"></span> <span id="wolfSliderVal">2</span></label>
          <input type="range" id="wolfCountSlider" min="1" max="5" value="2" oninput="document.getElementById('wolfSliderVal').textContent=this.value">
        </div>
      </div>
      <div class="flex gap-12 mt-16">
        <button class="btn btn-primary flex-1" onclick="startGame()" id="startBtn"><span data-i18n="start-game"></span></button>
        <button class="btn btn-danger btn-sm hidden" onclick="endGame()" id="endBtn"><span data-i18n="end-game"></span></button>
      </div>
    </div>

    <div id="roleDistributionCard" class="card hidden">
      <div style="font-weight:600;margin-bottom:8px" data-i18n="role-dist"></div>
      <div id="roleChips" class="role-preview"></div>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="screen-game" class="screen">
    <div id="phaseBanner" class="phase-banner phase-night">🌙 <span data-i18n="night"></span></div>

    <div class="stats-row">
      <div class="stat-card"><div class="num" id="gameRound">1</div><div class="label" data-i18n="round"></div></div>
      <div class="stat-card"><div class="num" id="gameAlive">0</div><div class="label" data-i18n="alive"></div></div>
      <div class="stat-card"><div class="num" id="gameOnline">0</div><div class="label" data-i18n="online"></div></div>
      <div class="stat-card"><div class="num" id="gameDead">0</div><div class="label" data-i18n="dead"></div></div>
    </div>

    <div id="gameMessage" class="card text-c hidden"></div>

    <div id="voteTally" class="card hidden">
      <div style="font-weight:600;margin-bottom:12px" data-i18n="vote-tally"></div>
      <div id="tallyList"></div>
    </div>

    <div id="gamePlayerList" class="player-list"></div>

    <div id="gameControls" class="card flex gap-12 wrap hidden"></div>
  </div>

</div>

<script>
// ===== STATE =====
let roomCode = null;
let hostToken = null;
let pollTimer = null;
let onlineTimer = null;
let isGameActive = false;

// ===== SETTINGS =====
const ADS_ENABLED = false;      // Show/hide ad banners
const SPONSORS_ENABLED = true;  // Show sponsor banners
const DONATIONS_ENABLED = true; // Show donation section
const POLL_INTERVAL = 1000;
const ONLINE_POLL_INTERVAL = 60000;

if (ADS_ENABLED) {
  document.getElementById('adBannerLanding').classList.add('show');
  document.getElementById('adBannerLobby').classList.add('show');
}
if (!SPONSORS_ENABLED) document.getElementById('sponsorBanner').classList.remove('show');
if (!DONATIONS_ENABLED) document.getElementById('donationCard').classList.remove('show');

// ===== INTERNAL t() with DOM update =====
function refreshTranslations() {
  document.querySelectorAll('[data-i18n]:not(button)').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('button[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
}

// ===== SCREEN MANAGEMENT =====
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== CREATE ROOM =====
async function createRoom() {
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = '⏳ ' + t('create-game');
  try {
    const r = await fetch(API_URL + '/api/rooms', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({wolf_count: parseInt(document.getElementById('wolfCountSlider').value)})
    });
    const data = await r.json();
    roomCode = data.room_code;
    hostToken = data.host_token;

    document.getElementById('roomCodeDisplay').textContent = roomCode;

    // Generate QR
    const qrDiv = document.getElementById('qrcode');
    qrDiv.innerHTML = '';
    const baseUrl = window.location.origin + window.location.pathname.replace(/\/?index\.html$/, '');
    const playerUrl = baseUrl + '/player.html?room=' + roomCode;
    if (typeof QRCode !== 'undefined') {
      new QRCode(qrDiv, { text: playerUrl, width: 180, height: 180 });
    } else {
      qrDiv.innerHTML = '<div style="background:#fff;padding:16px;border-radius:8px;color:#333">QR: ' + playerUrl + '</div>';
    }

    showScreen('screen-lobby');
    startOnlinePolling();
    startPolling();
  } catch(e) {
    alert('Failed to create room: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = '<span data-i18n="create-game"></span>';
  refreshTranslations();
}

// ===== POLLING =====
function startOnlinePolling() {
  if (onlineTimer) clearInterval(onlineTimer);
  onlineTimer = setInterval(async () => {
    if (!roomCode) return;
    try {
      await fetch(API_URL + '/api/check-ghosts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({room_code: roomCode})
      });
      const r = await fetch(API_URL + '/api/player-online?room_code=' + roomCode);
      const data = await r.json();
      if (Array.isArray(data)) {
        const online = data.filter(p => p.online).length;
        const offline = data.filter(p => !p.online).length;
        document.getElementById('statOnline').textContent = online;
        document.getElementById('statOffline').textContent = offline;
        document.getElementById('gameOnline').textContent = online;
        updateOnlineDots(data);
      }
    } catch(e) {}
  }, ONLINE_POLL_INTERVAL);
}

function updateOnlineDots(onlineData) {
  document.querySelectorAll('[data-pid]').forEach(el => {
    const pid = parseInt(el.dataset.pid);
    const info = onlineData ? onlineData.find(p => p.id === pid) : null;
    const dot = el.querySelector('.online-dot');
    if (dot && info) {
      dot.className = 'online-dot ' + (info.online ? 'online' : 'offline');
    }
  });
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollState, POLL_INTERVAL);
}

async function pollState() {
  if (!roomCode) return;
  try {
    const r = await fetch(API_URL + '/api/rooms/' + roomCode);
    const data = await r.json();
    if (data.error) return;

    if (data.phase === 'lobby') {
      if (isGameActive) return;
      document.getElementById('statTotal').textContent = data.playerCount;
      renderPlayerList('lobbyPlayerList', data.players, data.phase);
      updateOnlineDots(null);
      return;
    }

    if (!isGameActive) {
      isGameActive = true;
      showScreen('screen-game');
      document.getElementById('endBtn').classList.remove('hidden');
      document.getElementById('roleDistributionCard').classList.remove('hidden');
    }
    if (data.roles) updateRoleDistribution(data.roles);

    // Update stats
    document.getElementById('gameRound').textContent = data.round;
    document.getElementById('gameAlive').textContent = data.aliveCount;
    document.getElementById('gameDead').textContent = data.playerCount - data.aliveCount;

    // Phase banner
    updatePhaseBanner(data.phase);

    // Player list
    renderPlayerList('gamePlayerList', data.players, data.phase);

    // Message
    updateGameMessage(data);

    // Vote tally
    if (data.phase === 'day_voting') {
      document.getElementById('voteTally').classList.remove('hidden');
      await updateVoteTally();
    } else {
      document.getElementById('voteTally').classList.add('hidden');
    }

    // Victory
    if (data.phase === 'victory') showVictoryScreen(data);

    // Controls
    updateGameControls(data.phase);

  } catch(e) {}
}

// ===== RENDER PLAYERS =====
function getRoleColor(role) {
  const m = {villager:'#2ed573',werewolf:'#ff4757',seer:'#1e90ff',doctor:'#ffa502',shooter:'#ff6348',wolf_king:'#8b0000'};
  return m[role]||'#8888aa';
}
function getRoleName(role) {
  const m = {villager:t('villager'),werewolf:t('werewolf'),wolf_king:t('wolf_king'),seer:t('seer'),doctor:t('doctor'),shooter:t('shooter')};
  return m[role]||role;
}

function renderPlayerList(containerId, players, phase) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';

  players.forEach(p => {
    const isDead = !p.alive;
    const card = document.createElement('div');
    card.className = 'player-card fade-in' + (isDead ? ' dead' : '');
    card.dataset.pid = p.id;

    let roleBadgeHTML = '';
    if (p.role && isDead) {
      roleBadgeHTML = `<span class="badge-role" style="background:${getRoleColor(p.role)}22;color:${getRoleColor(p.role)}">${getRoleName(p.role)}</span>`;
    }

    card.innerHTML = `
      <div class="online-dot online"></div>
      <span class="player-name">${p.name}</span>
      ${isDead ? `<span class="badge badge-dead">${t('dead')}</span>` : `<span class="badge badge-alive">${t('alive')}</span>`}
      ${roleBadgeHTML}
      ${phase === 'lobby' ? `<button class="btn btn-sm btn-danger" onclick="kickPlayer(${p.id})">✕</button>` : ''}
    `;
    container.appendChild(card);
  });
}

// ===== PHASE BANNER =====
function updatePhaseBanner(phase) {
  const b = document.getElementById('phaseBanner');
  let emoji = '🌙', text = t('night'), cls = 'phase-night';
  if (phase === 'day_discussion') { emoji = '☀️'; text = t('discussion'); cls = 'phase-day'; }
  else if (phase === 'day_voting') { emoji = '🗳️'; text = t('voting'); cls = 'phase-vote'; }
  else if (phase === 'day_results') { emoji = '📢'; text = t('results'); cls = 'phase-day'; }
  else if (phase === 'victory') { emoji = '🏆'; text = t('victory'); cls = 'phase-victory'; }
  b.className = 'phase-banner ' + cls;
  b.innerHTML = `${emoji} ${text}`;
}

// ===== GAME MESSAGE =====
function updateGameMessage(data) {
  const el = document.getElementById('gameMessage');
  let msg = '';
  if (data.phase === 'night') {
    msg = data.lastDoctorSaved ? '💉 ' + t('doctor-saved') :
          data.lastKilledName ? '☠️ ' + data.lastKilledName + ' ' + t('was-killed') :
          '🌙 ' + t('night-falls');
  } else if (data.phase === 'day_discussion') {
    msg = data.lastKilledName ? '☠️ ' + data.lastKilledName + ' ' + t('was-killed') :
          data.lastDoctorSaved ? '💉 ' + t('doctor-saved') :
          '🌅 ' + t('no-one-died');
  } else if (data.phase === 'day_results') {
    msg = data.lastKilledName ? '☠️ ' + data.lastKilledName + ' ' + t('was-eliminated') : '';
  }
  if (msg) {
    el.classList.remove('hidden');
    el.innerHTML = msg;
    el.className = 'card text-c fade-in';
  } else {
    el.classList.add('hidden');
  }
}

// ===== VOTE TALLY =====
async function updateVoteTally() {
  try {
    const r = await fetch(API_URL + '/api/vote-tally?room_code=' + roomCode);
    const data = await r.json();
    const list = document.getElementById('tallyList');
    if (!data.tally || data.tally.length === 0) {
      list.innerHTML = `<div style="color:#8888aa;text-align:center;padding:12px">${t('no-votes')}</div>`;
      return;
    }
    const maxV = Math.max(...data.tally.map(t => t.votes), 1);
    list.innerHTML = data.tally.map(t =>
      `<div class="fade-in">
        <div class="flex items-c justify-b gap-8" style="margin-bottom:4px">
          <span style="font-size:14px;font-weight:500">${t.playerName}</span>
          <span style="font-size:12px;color:#8888aa">${t.votes} ${t('votes')}</span>
        </div>
        <div class="tally-bar"><div class="tally-fill" style="width:${t.votes/maxV*100}%;background:${t.votes===maxV?'#ff4757':'#6c63ff'}"></div></div>
      </div>`
    ).join('');
  } catch(e) {}
}

// ===== CONTROLS =====
function updateGameControls(phase) {
  const c = document.getElementById('gameControls');
  c.style.display = 'flex';
  if (phase === 'night') {
    c.innerHTML = `<button class="btn btn-primary flex-1" onclick="processNight()"><span data-i18n="process-night"></span></button>`;
  } else if (phase === 'day_results') {
    c.innerHTML = `<button class="btn btn-success flex-1" onclick="continueToNight()"><span data-i18n="continue"></span></button>`;
  } else if (phase === 'day_discussion') {
    c.innerHTML = `<button class="btn btn-primary flex-1" onclick="startVoting()">🗳️ <span data-i18n="start-voting"></span></button>`;
  } else if (phase === 'day_voting') {
    c.innerHTML = `<button class="btn btn-danger flex-1" onclick="processDay()"><span data-i18n="process-day"></span></button>`;
  } else if (phase === 'victory') {
    c.innerHTML = `<button class="btn btn-success flex-1" onclick="newGame()"><span data-i18n="new-game"></span></button>`;
  } else {
    c.style.display = 'none';
  }
  refreshTranslations();
}

// ===== ACTIONS =====
async function processNight() {
  await fetch(API_URL + '/api/process-night', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode})});
}
async function continueToNight() {
  await fetch(API_URL + '/api/continue-to-night', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode})});
}
async function startVoting() {
  await fetch(API_URL + '/api/update-phase', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode,phase:'day_voting',duration:60})});
}
async function processDay() {
  await fetch(API_URL + '/api/process-day', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode})});
}
async function startGame() {
  const wc = parseInt(document.getElementById('wolfCountSlider').value);
  await fetch(API_URL + '/api/assign-roles', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode,wolf_count:wc})});
  document.getElementById('endBtn').classList.remove('hidden');
}
async function endGame() {
  if (confirm(t('end-game') + '?')) {
    cleanup();
    showScreen('screen-landing');
  }
}
async function newGame() {
  cleanup();
  showScreen('screen-landing');
}
async function kickPlayer(id) {
  await fetch(API_URL + '/api/players', {method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_code:roomCode,player_id:id,host_token:hostToken})});
}

// ===== VICTORY =====
function showVictoryScreen(data) {
  const b = document.getElementById('phaseBanner');
  b.className = 'phase-banner phase-victory';
  b.innerHTML = data.winner === 'village' ? '🏆 ' + t('village-wins') : '🐺 ' + t('werewolf-wins');

  if (data.finalWords && Object.keys(data.finalWords).length > 0) {
    let fw = '<div style="font-weight:600;margin-bottom:8px">' + t('final-words') + '</div>';
    Object.values(data.finalWords).forEach(w => {
      fw += '<div class="card fade-in" style="padding:10px;margin-bottom:6px;font-size:14px"><strong>' + w.name + ':</strong> ' + w.text + '</div>';
    });
    document.getElementById('gameMessage').classList.remove('hidden');
    document.getElementById('gameMessage').className = 'card text-c';
    document.getElementById('gameMessage').innerHTML = fw;
  }
}

// ===== ROLE DISTRIBUTION =====
function updateRoleDistribution(roles) {
  const chips = document.getElementById('roleChips');
  chips.innerHTML = Object.entries(roles).filter(([_,c]) => c > 0)
    .map(([role, count]) =>
      `<span class="role-chip" style="background:${getRoleColor(role)}22;color:${getRoleColor(role)}">${getRoleName(role)} x${count}</span>`
    ).join('');
}

// ===== UTILITY =====
function copyRoomCode() {
  if (roomCode) navigator.clipboard.writeText(roomCode);
}
function cleanup() {
  roomCode = null; hostToken = null; isGameActive = false;
  if (pollTimer) clearInterval(pollTimer);
  if (onlineTimer) clearInterval(onlineTimer);
  pollTimer = null; onlineTimer = null;
}

// ===== CLEANUP =====
window.addEventListener('beforeunload', cleanup);
</script>
